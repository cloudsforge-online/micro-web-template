<!doctype html>
<!--
  data-cf-product picks the accent ramp and data-cf-substrate the ash ramp, both from
  @cloudsforge/ui/tokens.css. They are on <html> and set STATICALLY here rather than by React,
  because a page that paints before the attributes land flashes the default ember and then
  changes colour. Instantiating this template means changing these two values and PRODUCT in
  src/lib/hosts.ts, which the boot check keeps in agreement.
-->
<html lang="en-GB" data-cf-product="trade" data-cf-substrate="cool">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="colour-scheme" content="dark light" />
    <!--
      The build that produced this bundle. Stamped by the Dockerfile, read by src/lib/obs.ts, and
      the reason an error report can be pinned to the deploy that introduced it. It is an identity
      rather than a configuration: it names the artefact, it does not tell it where it is running.
    -->
    <meta name="cf-release" content="dev" />

    <!--
      THE GOOGLE ANALYTICS MEASUREMENT ID, AND NOT THE GOOGLE ANALYTICS TAG.
      ────────────────────────────────────────────────────────────────────────────────────────
      There is deliberately no loader script for Google's tag in this file, and there must never be
      one. (Its host and its global function are not written out here either, so that a grep for
      either over this file answers zero.) The stock snippet fetches a third-party script and sets
      `_ga` on load — before any banner has been drawn, let alone answered — and under ePrivacy
      Art. 5(3) an analytics cookie set before consent is a violation that a banner underneath it
      does not cure. `@cloudsforge/ui/consent` injects the tag from exactly one place: the Accept
      button.

      It is a meta tag rather than a build-time constant because test/no-build-time-config.test.ts
      greps for those and fails the build — an artefact with an environment frozen into it is not
      the artefact that passed CI. (That test greps this file too, which is why the prefix is not
      spelled out here.) The ID is an identity rather than a configuration: it names the property,
      it does not say where the bundle is running. An absent or empty value means analytics is
      simply off, which is what a local `pnpm dev` gets.

      ── WHY IT IS IN THE TEMPLATE (micro-org#487) ─────────────────────────────────────────────
      Because the defect is an OMISSION, and the template is where an omission gets inherited —
      the same argument brand-chrome.test.ts already makes about the favicon. The tag was live on
      the marketing site and on no other surface: every frontend cut from here shipped with no
      measurement of any kind and nobody noticed, because nothing anywhere asserted that a page
      can report a page view. The three surfaces that legitimately do NOT carry this — the
      operator console, the operator's dashboard and the synthetic-traffic runner — each say so in
      their own index.html, in writing. Deleting this line is a decision a surface must make on
      purpose and record, not one it makes by forgetting.

      It is inseparable from the other two halves: `initAnalytics()` in src/main.tsx primes Consent
      Mode DENIED before anything runs, and `<CookieBanner />` in the shell is the only thing that
      can change that. test/analytics.test.ts fails if any one of the three goes missing, because
      a page that carries the ID and draws no banner is worse than one that carries neither.
    -->
    <meta name="cf-analytics" content="G-ZFBLKK519K" />

    <!--
      PLACEHOLDER CHROME — replace these four files with the set for YOUR surface, from
      micro-brand's `assets/<surface>/`. They are the company marks so that a freshly cut frontend
      is never iconless: three frontends shipped with the browser's blank-page glyph in the tab
      and a bare URL wherever they were shared, because nothing asserted a page has an icon and
      nothing inherited one. test/brand-chrome.test.ts is what fails now if they go missing.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />

    <title>Forge Trade</title>
  
    <!-- Relative on purpose: one bundle serves localhost, preview and the apex, and this file
         names no hostname. Crawlers resolve it against the page they fetched. An absolute URL
         here would bake a hostname into the artefact — the same defect as build-time config. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CloudsForge" />
    <meta property="og:description" content="Replace this with the surface's own description." />
    <meta property="og:image" content="/og-1200x630.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
